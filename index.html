<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>피카츄의 생존일기(지우는나의친구)</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #0d0f12;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            user-select: none;
            overflow-x: hidden;
        }

        /* 전체 레이아웃 (좌측 타임라인 + 우측 게임) */
        .game-wrapper {
            display: flex;
            align-items: flex-start;
            gap: 24px;
            background: rgba(22, 27, 34, 0.75);
            padding: 24px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(255, 220, 0, 0.05);
            backdrop-filter: blur(10px);
        }

        /* 좌측 진행률 바 컨테이너 */
        .timeline-sidebar {
            width: 70px;
            background: rgba(13, 17, 23, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            padding: 18px 8px;
            display: flex;
            flex-direction: column;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.5);
            height: 445px;
        }

        .timeline-header {
            text-align: center;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .timeline-title {
            font-size: 15px;
            font-weight: 800;
            color: #ffd000;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(255, 208, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .timeline-body {
            position: relative;
            flex: 1;
            display: flex;
            margin: 6px 0;
        }

        /* 세로 게이지 트랙 */
        .progress-track {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            top: 10px;
            bottom: 10px;
            width: 8px;
            background: #21262d;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .progress-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 0%;
            background: linear-gradient(to top, #ff9900, #ffee00, #00f2fe);
            border-radius: 4px;
            box-shadow: 0 0 14px #ffee00;
            transition: height 0.2s ease-out;
        }

        /* 페이즈 마커 목록 */
        .phase-nodes {
            position: absolute;
            left: 0;
            top: 10px;
            bottom: 10px;
            right: 0;
        }

        .phase-node {
            position: absolute;
            left: 0;
            right: 0;
            transform: translateY(50%);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .node-pin {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #161b22;
            border: 2px solid #484f58;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            z-index: 2;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        /* 달성 및 활성 상태 스타일 */
        .phase-node.reached .node-pin {
            border-color: #ffd000;
            background: #2d2605;
            box-shadow: 0 0 10px rgba(255, 208, 0, 0.6);
        }

        .phase-node.active .node-pin {
            border-color: #00f2fe;
            background: #0d2938;
            box-shadow: 0 0 14px rgba(0, 242, 254, 0.9);
            transform: scale(1.15);
        }

        /* 우측 메인 게임 영역 */
        .game-main {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 600px;
            margin-bottom: 12px;
        }

        .info {
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .invincible-text {
            color: #ffee00;
            text-shadow: 0 0 8px #ff8800;
            font-size: 15px;
            transition: opacity 0.05s ease;
        }

        .test-btn {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.8);
            padding: 6px 14px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 75, 43, 0.5);
            transition: all 0.2s ease;
        }

        .test-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(255, 75, 43, 0.8);
        }

        .test-btn.active {
            background: linear-gradient(135deg, #00b09b, #96c93d);
            box-shadow: 0 0 12px rgba(150, 201, 61, 0.8);
        }

        #gameCanvas {
            background-color: #000;
            border: 3px solid #30363d;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.8);
            display: block;
        }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <!-- 좌측 진행률 바 & 페이즈 타임라인 -->
        <div class="timeline-sidebar">
            <div class="timeline-header">
                <div class="timeline-title">⚡</div>
            </div>
            
            <div class="timeline-body">
                <!-- 세로 프로그레스 바 트랙 및 그래픽 게이지 -->
                <div class="progress-track">
                    <div id="progressBarFill" class="progress-fill"></div>
                </div>

                <!-- 페이즈 노드 (아래 0s -> 위 70s) -->
                <div class="phase-nodes">
                    <!-- 70s : 클리어 (백만볼트) -->
                    <div class="phase-node" id="node-70" style="bottom: 100%;">
                        <div class="node-pin">⚡</div>
                    </div>

                    <!-- 50s : 사이코키네시스 & 고스트 Phase -->
                    <div class="phase-node" id="node-50" style="bottom: 71.4%;">
                        <div class="node-pin">🔮</div>
                    </div>

                    <!-- 35s : 하이드로펌프 & 스피드 강화 -->
                    <div class="phase-node" id="node-35" style="bottom: 50%;">
                        <div class="node-pin">💧</div>
                    </div>

                    <!-- 18s : 불대문자 & Phase 2 -->
                    <div class="phase-node" id="node-18" style="bottom: 25.7%;">
                        <div class="node-pin">🔥</div>
                    </div>

                    <!-- 0s : 시작 단계 -->
                    <div class="phase-node active reached" id="node-0" style="bottom: 0%;">
                        <div class="node-pin">🌱</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 우측 메인 게임 -->
        <div class="game-main">
            <div class="header-container">
                <div class="info">
                    <span>생존 시간: <strong id="score">0</strong>초</span>
                    <span id="invincibleStatus" class="invincible-text" style="display: none;">⚡ 라이츄 진화 (무적)! ⚡</span>
                </div>
                <button id="testBtn" class="test-btn">쫄?</button>
            </div>

            <canvas id="gameCanvas" width="600" height="400"></canvas>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas ? canvas.getContext("2d") : null;
        const scoreElement = document.getElementById("score");
        const invincibleStatusElement = document.getElementById("invincibleStatus");
        const testBtn = document.getElementById("testBtn");

        // 진행률 바 DOM 엘리먼트
        const progressBarFill = document.getElementById("progressBarFill");
        const node0 = document.getElementById("node-0");
        const node18 = document.getElementById("node-18");
        const node35 = document.getElementById("node-35");
        const node50 = document.getElementById("node-50");
        const node70 = document.getElementById("node-70");

        // 무적 모드 상태
        let isTestInvincible = false;

        if (testBtn) {
            testBtn.addEventListener("click", () => {
                isTestInvincible = !isTestInvincible;
                if (isTestInvincible) {
                    testBtn.classList.add("active");
                    pikachu.isInvincible = true;
                    if (invincibleStatusElement) {
                        invincibleStatusElement.textContent = "🛡️ 무적 모드 활성화 중!";
                        invincibleStatusElement.style.display = "inline";
                        invincibleStatusElement.style.opacity = "1";
                    }
                } else {
                    testBtn.classList.remove("active");
                    pikachu.isInvincible = false;
                    pikachu.invincibleTimer = 0;
                    pikachu.speed = pikachu.normalSpeed;
                    if (invincibleStatusElement) {
                        invincibleStatusElement.style.display = "none";
                    }
                }
            });
        }

        let pikachuLoaded = false, raichuLoaded = false, charizardLoaded = false, redLoaded = false;
        let blastoiseLoaded = false, mewtwoLoaded = false, alakazamLoaded = false, oakLoaded = false;
        let slowpokeLoaded = false, slowkingLoaded = false, slowbroLoaded = false;
        let magikarpLoaded = false, mewLoaded = false;
        let pidgeotLoaded = false, gyaradosLoaded = false, redGyaradosLoaded = false, caterpieLoaded = false;
        let zapdosLoaded = false, hoohLoaded = false, articunoLoaded = false, weedleLoaded = false;
        let gastlyLoaded = false, haunterLoaded = false, gengarLoaded = false;
        let thunderStoneLoaded = false;

        const BASE_CDN = "https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/pokemon/other/official-artwork/";

        function loadImage(url, onLoad, onErrorFallback) {
            const img = new Image();
            img.onload = onLoad;
            img.onerror = () => {
                if (onErrorFallback) onErrorFallback();
            };
            img.src = url;
            return img;
        }

        const pikachuImg = loadImage(`${BASE_CDN}25.png`, () => pikachuLoaded = true);
        const raichuImg = loadImage(`${BASE_CDN}26.png`, () => raichuLoaded = true);
        const charizardImg = loadImage("https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/6.png", () => charizardLoaded = true);
        const blastoiseImg = loadImage("https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/9.png", () => blastoiseLoaded = true);
        const alakazamImg = loadImage("https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/65.png", () => alakazamLoaded = true);
        const mewtwoImg = loadImage(`${BASE_CDN}150.png`, () => mewtwoLoaded = true);

        const oakImg = loadImage("https://play.pokemonshowdown.com/sprites/trainers/oak.png", 
            () => oakLoaded = true,
            () => {
                oakImg.src = "https://raw.githubusercontent.com/smogon/sprites/master/sprites/trainers/professoroak.png";
                oakImg.onload = () => oakLoaded = true;
            }
        );

        const slowpokeImg = loadImage(`${BASE_CDN}79.png`, () => slowpokeLoaded = true);
        const slowkingImg = loadImage(`${BASE_CDN}199.png`, () => slowkingLoaded = true);
        const slowbroImg = loadImage(`${BASE_CDN}80.png`, () => slowbroLoaded = true);

        const magikarpImg = loadImage(`${BASE_CDN}129.png`, () => magikarpLoaded = true);
        const mewImg = loadImage(`${BASE_CDN}151.png`, () => mewLoaded = true);

        const pidgeotImg = loadImage(`${BASE_CDN}18.png`, () => pidgeotLoaded = true);
        const gyaradosImg = loadImage(`${BASE_CDN}130.png`, () => gyaradosLoaded = true);
        const redGyaradosImg = loadImage("https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/shiny/130.png", 
            () => redGyaradosLoaded = true,
            () => {
                redGyaradosImg.src = `${BASE_CDN}130.png`;
                redGyaradosImg.onload = () => redGyaradosLoaded = true;
            }
        );
        const caterpieImg = loadImage(`${BASE_CDN}10.png`, () => caterpieLoaded = true);

        const zapdosImg = loadImage(`${BASE_CDN}145.png`, () => zapdosLoaded = true);
        const hoohImg = loadImage(`${BASE_CDN}250.png`, () => hoohLoaded = true);
        const articunoImg = loadImage(`${BASE_CDN}144.png`, () => articunoLoaded = true);
        const weedleImg = loadImage(`${BASE_CDN}13.png`, () => weedleLoaded = true);
        const gastlyImg = loadImage(`${BASE_CDN}92.png`, () => gastlyLoaded = true);
        const haunterImg = loadImage(`${BASE_CDN}93.png`, () => haunterLoaded = true);
        const gengarImg = loadImage(`${BASE_CDN}94.png`, () => gengarLoaded = true);

        const redImg = loadImage("https://play.pokemonshowdown.com/sprites/trainers/red.png", 
            () => redLoaded = true,
            () => {
                redImg.src = "https://raw.githubusercontent.com/smogon/sprites/master/sprites/trainers/red.png";
                redImg.onload = () => redLoaded = true;
            }
        );

        const thunderStoneImg = new Image();
        thunderStoneImg.onload = () => thunderStoneLoaded = true;
        thunderStoneImg.src = "data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%23ffea00' opacity='0.25'/%3E%3Cpolygon points='50,6 88,26 92,68 50,94 8,68 12,26' fill='%23cc7a00' stroke='%23ffea00' stroke-width='4'/%3E%3Cpolygon points='50,12 82,30 85,64 50,88 15,64 18,30' fill='%23ff9900'/%3E%3Cpolygon points='50,12 50,88 85,64' fill='%23b36200' opacity='0.4'/%3E%3Cpolygon points='50,12 18,30 15,64' fill='%23ffbf00' opacity='0.5'/%3E%3Cpath d='M58,14 L28,50 L48,50 L38,86 L74,42 L52,42 Z' fill='%23ffffff' stroke='%23111111' stroke-width='3.5' stroke-linejoin='round'/%3E%3Cpath d='M56,17 L32,48 L48,48 L40,81 L70,44 L53,44 Z' fill='%23ffff00'/%3E%3C/svg%3E";

        const CANVAS_WIDTH = canvas ? canvas.width : 600;
        const CANVAS_HEIGHT = canvas ? canvas.height : 400;
        
        const BASE_SLOWPOKE_SPEED = 152;
        const BASE_MAGIKARP_SPEED = BASE_SLOWPOKE_SPEED * 0.5;
        const THUNDER_STONE_SPEED = BASE_MAGIKARP_SPEED;
        const BASE_PIDGEOT_SPEED = 304;
        const BASE_ZAPDOS_SPEED = 456;

        let isGameOver = false;
        let isGameWon = false;
        let isPhase2 = false;
        let charizardTriggered = false;
        let blastoiseTriggered = false;
        let alakazamTriggered = false;
        let pikachuThunderboltTriggered = false;
        let redThunderTriggered = false;
        let isBlastoiseEventFinished = false;

        let red = null;
        let charizard = null;
        let blastoise = null;
        let alakazam = null;
        let fireBlast = null;
        let hydroPump = null;
        let isPsychicActive = false;
        let globalObstacleOpacity = 1.0;
        let fireParticles = [];

        let isThunderboltActive = false;
        let thunderboltTimer = 0;
        let lightningBolts = [];

        let startTime = Date.now();
        let survivalTime = 0;
        let lastTime = 0;

        let pidgeotInterval = null;
        let zapdosInterval = null;
        let magikarpInterval = null;
        let thunderStoneTimeout = null;
        let thunderStoneInterval = null;
        let ghostInterval = null;

        let nextMewtwoSpawnTime = 30;
        let isGhostPhase = false;

        const keys = {};

        const pikachu = {
            x: CANVAS_WIDTH / 2,
            y: CANVAS_HEIGHT / 2,
            size: 18,
            drawWidth: 45,
            drawHeight: 45,
            normalSpeed: 210,
            boostedSpeed: 360,
            speed: 210,
            isInvincible: false,
            invincibleTimer: 0
        };

        let slowpokes = [];
        let magikarps = [];
        let pidgeots = [];
        let zapdoses = [];
        let ghosts = [];
        let thunderStones = [];
        let electricSparkParticles = [];

        window.addEventListener("keydown", (e) => {
            if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "w", "a", "s", "d", "W", "A", "S", "D"].includes(e.key)) {
                e.preventDefault();
            }
            keys[e.key] = true;

            if ((isGameOver || isGameWon) && (e.key === "r" || e.key === "R")) {
                restartGame();
            }
        });

        window.addEventListener("keyup", (e) => {
            keys[e.key] = false;
        });

        // 진행률 게이지 바 전용 업데이트 함수 (% 텍스트 제외)
        function updateProgressBar() {
            const TARGET_TIME = 70; // 70초 달성 시 승리
            const rawPercent = Math.min(100, Math.max(0, (survivalTime / TARGET_TIME) * 100));

            if (progressBarFill) {
                progressBarFill.style.height = `${rawPercent}%`;
            }

            const nodes = [
                { el: node0, time: 0 },
                { el: node18, time: 18 },
                { el: node35, time: 35 },
                { el: node50, time: 50 },
                { el: node70, time: 70 }
            ];

            let currentActiveIndex = 0;
            nodes.forEach((n, idx) => {
                if (!n.el) return;
                if (survivalTime >= n.time) {
                    n.el.classList.add("reached");
                    currentActiveIndex = idx;
                } else {
                    n.el.classList.remove("reached");
                }
                n.el.classList.remove("active");
            });

            if (nodes[currentActiveIndex] && nodes[currentActiveIndex].el) {
                nodes[currentActiveIndex].el.classList.add("active");
            }
        }

        function getSpawnPosition() {
            let spawnX, spawnY;
            const side = Math.floor(Math.random() * 4);

            if (side === 0) { spawnX = Math.random() * CANVAS_WIDTH; spawnY = -50; }
            else if (side === 1) { spawnX = CANVAS_WIDTH + 50; spawnY = Math.random() * CANVAS_HEIGHT; }
            else if (side === 2) { spawnX = Math.random() * CANVAS_WIDTH; spawnY = CANVAS_HEIGHT + 50; }
            else { spawnX = -50; spawnY = Math.random() * CANVAS_HEIGHT; }

            return { spawnX, spawnY };
        }

        function spawnSlowpoke() {
            if (isGhostPhase || isThunderboltActive || isGameWon) return;
            const { spawnX, spawnY } = getSpawnPosition();
            const angle = Math.atan2(pikachu.y - spawnY, pikachu.x - spawnX);
            const speed = isPhase2 ? BASE_SLOWPOKE_SPEED * 1.05 : BASE_SLOWPOKE_SPEED;
            
            const isMidPhase = isBlastoiseEventFinished && !isGhostPhase;
            let type = 'slowpoke';
            let sizeMult = 1.0;

            if (isMidPhase) {
                type = 'slowking';
                sizeMult = 1.3;
            } else if (isPhase2) {
                type = 'slowbro';
                sizeMult = 1.3;
            }

            slowpokes.push({
                x: spawnX,
                y: spawnY,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                size: 15 * sizeMult,
                drawWidth: 40 * sizeMult,
                drawHeight: 40 * sizeMult,
                type: type
            });
        }

        function spawnMagikarp() {
            if (isThunderboltActive || isGameWon) return;
            const { spawnX, spawnY } = getSpawnPosition();
            const angle = Math.atan2(pikachu.y - spawnY, pikachu.x - spawnX);
            const speed = isPhase2 ? BASE_MAGIKARP_SPEED * 1.2 : BASE_MAGIKARP_SPEED;

            magikarps.push({
                x: spawnX,
                y: spawnY,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                size: 16,
                drawWidth: 42,
                drawHeight: 42,
                type: isPhase2 ? 'mew' : 'magikarp'
            });
        }

        function spawnThunderStone() {
            if (isThunderboltActive || isGameWon) return;
            const { spawnX, spawnY } = getSpawnPosition();
            const angle = Math.atan2(pikachu.y - spawnY, pikachu.x - spawnX);

            thunderStones.push({
                x: spawnX,
                y: spawnY,
                vx: Math.cos(angle) * THUNDER_STONE_SPEED,
                vy: Math.sin(angle) * THUNDER_STONE_SPEED,
                size: 16,
                drawWidth: 36,
                drawHeight: 36
            });
        }

        function spawnPidgeot() {
            if (isThunderboltActive || isGameWon) return;
            const { spawnX, spawnY } = getSpawnPosition();
            const angle = Math.atan2(pikachu.y - spawnY, pikachu.x - spawnX);
            const speed = isPhase2 ? BASE_PIDGEOT_SPEED * 1.2 : BASE_PIDGEOT_SPEED;

            const isMidPhase = isBlastoiseEventFinished && !isGhostPhase;
            let type = 'pidgeot';
            let size = 18;
            let dWidth = 55;
            let dHeight = 55;

            if (isGhostPhase) {
                type = 'caterpie';
                size = 18;
                dWidth = 48;
                dHeight = 48;
            } else if (isMidPhase) {
                type = 'red_gyarados';
                size = 22;
                dWidth = 66;
                dHeight = 66;
            } else if (isPhase2) {
                type = 'gyarados';
                size = 22;
                dWidth = 66;
                dHeight = 66;
            }

            pidgeots.push({
                x: spawnX,
                y: spawnY,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                size: size,
                drawWidth: dWidth,
                drawHeight: dHeight,
                type: type
            });
        }

        function spawnZapdos(forceMewtwo = false) {
            if (isThunderboltActive || isGameWon) return;
            const { spawnX, spawnY } = getSpawnPosition();
            const angle = Math.atan2(pikachu.y - spawnY, pikachu.x - spawnX);
            
            const isMidPhase = isBlastoiseEventFinished && !isGhostPhase;
            let speed = BASE_ZAPDOS_SPEED;
            let type = 'zapdos';
            let size = 22;
            let dWidth = 65;
            let dHeight = 65;

            if (forceMewtwo) {
                speed = BASE_ZAPDOS_SPEED * 1.1; 
                if (isGhostPhase) {
                    type = 'oak';
                    size = 66;
                    dWidth = 195;
                    dHeight = 195; 
                } else {
                    type = 'mewtwo';
                    size = 44; 
                    dWidth = 130;
                    dHeight = 130;
                }
            } else if (isGhostPhase) {
                speed = BASE_ZAPDOS_SPEED * 1.1;
                type = 'weedle';
                size = 20;
                dWidth = 50;
                dHeight = 50;
            } else if (isMidPhase) {
                speed = BASE_ZAPDOS_SPEED * 1.1;
                type = 'articuno';
            } else if (isPhase2) { 
                speed = BASE_ZAPDOS_SPEED * 1.1;
                type = 'hooh';
            }

            zapdoses.push({
                x: spawnX,
                y: spawnY,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                size: size,
                drawWidth: dWidth,
                drawHeight: dHeight,
                type: type
            });
        }

        function spawnGhost() {
            if (isThunderboltActive || isGameWon) return;
            const { spawnX, spawnY } = getSpawnPosition();
            const angle = Math.atan2(pikachu.y - spawnY, pikachu.x - spawnX);
            const speed = BASE_ZAPDOS_SPEED * 1.1;
            const r = Math.random();
            let type = 'gastly';
            let size = 20;
            let dWidth = 55;
            let dHeight = 55;

            if (r < 0.33) {
                type = 'gastly'; size = 20; dWidth = 55; dHeight = 55;
            } else if (r < 0.66) {
                type = 'haunter'; size = 24; dWidth = 65; dHeight = 65;
            } else {
                type = 'gengar'; size = 28; dWidth = 75; dHeight = 75;
            }

            ghosts.push({
                x: spawnX,
                y: spawnY,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                size: size,
                drawWidth: dWidth,
                drawHeight: dHeight,
                type: type
            });
        }

        function startSpecialTimers() {
            if (pidgeotInterval) clearInterval(pidgeotInterval);
            if (zapdosInterval) clearInterval(zapdosInterval);
            if (magikarpInterval) clearInterval(magikarpInterval);
            if (thunderStoneTimeout) clearTimeout(thunderStoneTimeout);
            if (thunderStoneInterval) clearInterval(thunderStoneInterval);
            if (ghostInterval) clearInterval(ghostInterval);

            pidgeotInterval = setInterval(() => { if (!isGameOver && !isGameWon) spawnPidgeot(); }, 7000);
            magikarpInterval = setInterval(() => { if (!isGameOver && !isGameWon) spawnMagikarp(); }, 15000);
            zapdosInterval = setInterval(() => { if (!isGameOver && !isGameWon) spawnZapdos(); }, 20000);

            thunderStoneTimeout = setTimeout(() => {
                if (!isGameOver && !isGameWon) {
                    spawnThunderStone();
                    thunderStoneInterval = setInterval(() => {
                        if (!isGameOver && !isGameWon) spawnThunderStone();
                    }, 8000);
                }
            }, 8000);
        }

        function restartGame() {
            isGameOver = false;
            isGameWon = false;
            isPhase2 = false;
            charizardTriggered = false;
            blastoiseTriggered = false;
            alakazamTriggered = false;
            pikachuThunderboltTriggered = false;
            redThunderTriggered = false;
            isBlastoiseEventFinished = false;

            red = null;
            charizard = null;
            blastoise = null;
            alakazam = null;
            fireBlast = null;
            hydroPump = null;
            isPsychicActive = false;
            globalObstacleOpacity = 1.0;
            fireParticles = [];

            isThunderboltActive = false;
            thunderboltTimer = 0;
            lightningBolts = [];

            slowpokes = [];
            magikarps = [];
            pidgeots = [];
            zapdoses = [];
            ghosts = [];
            thunderStones = [];
            electricSparkParticles = [];

            nextMewtwoSpawnTime = 30;
            isGhostPhase = false;
            if (ghostInterval) clearInterval(ghostInterval);
            ghostInterval = null;

            pikachu.x = CANVAS_WIDTH / 2;
            pikachu.y = CANVAS_HEIGHT / 2;
            pikachu.normalSpeed = 210;
            pikachu.speed = 210;
            pikachu.isInvincible = isTestInvincible;
            pikachu.invincibleTimer = 0;

            if (invincibleStatusElement) {
                if (isTestInvincible) {
                    invincibleStatusElement.textContent = "🛡️ 무적 모드 활성화 중!";
                    invincibleStatusElement.style.display = "inline";
                    invincibleStatusElement.style.opacity = "1";
                } else {
                    invincibleStatusElement.style.display = "none";
                    invincibleStatusElement.style.opacity = "1";
                }
            }

            startTime = Date.now();
            lastTime = performance.now();
            updateProgressBar();
            startSpecialTimers();
            requestAnimationFrame(gameLoop);
        }

        function update(currentTime) {
            if (isGameOver || isGameWon) return;

            if (!lastTime) lastTime = currentTime;
            let dt = (currentTime - lastTime) / 1000;
            lastTime = currentTime;

            if (isNaN(dt) || dt > 0.1) dt = 0.016;

            if (!isThunderboltActive && !isGameWon) {
                survivalTime = Math.floor((Date.now() - startTime) / 1000);
                if (scoreElement) scoreElement.textContent = survivalTime;
                updateProgressBar();
            }

            // 이벤트 제어 로직
            if (survivalTime >= 70 && !pikachuThunderboltTriggered) {
                pikachuThunderboltTriggered = true;
                red = {
                    x: CANVAS_WIDTH + 100,
                    y: CANVAS_HEIGHT / 2 + 75,
                    targetX: CANVAS_WIDTH - 70, 
                    drawWidth: 150, 
                    drawHeight: 150, 
                    state: 'entering_p',
                    timer: 0,
                    text: "피카츄, 백만볼트!"
                };
            } else if (survivalTime >= nextMewtwoSpawnTime && survivalTime < 70) {
                spawnZapdos(true);
                nextMewtwoSpawnTime += 10;
            }

            if (survivalTime >= 50 && !alakazamTriggered) {
                alakazamTriggered = true;
                red = {
                    x: CANVAS_WIDTH + 100,
                    y: CANVAS_HEIGHT / 2 + 75,
                    targetX: CANVAS_WIDTH - 70, 
                    drawWidth: 150, 
                    drawHeight: 150, 
                    state: 'entering_a',
                    timer: 0,
                    text: "후딘, 사이코키네시스!"
                };
            } else if (survivalTime >= 35 && !blastoiseTriggered) {
                blastoiseTriggered = true;
                red = {
                    x: CANVAS_WIDTH + 100,
                    y: CANVAS_HEIGHT / 2 + 75,
                    targetX: CANVAS_WIDTH - 70, 
                    drawWidth: 150, 
                    drawHeight: 150, 
                    state: 'entering_b',
                    timer: 0,
                    text: "거북왕, 하이드로펌프!"
                };
            } else if (survivalTime >= 18 && !charizardTriggered) {
                charizardTriggered = true;
                isPhase2 = true;
                red = {
                    x: CANVAS_WIDTH + 100,
                    y: CANVAS_HEIGHT / 2 + 75,
                    targetX: CANVAS_WIDTH - 70, 
                    drawWidth: 150, 
                    drawHeight: 150, 
                    state: 'entering',
                    timer: 0,
                    text: "리자몽, 불대문자!"
                };
            }

            // 레드 동작 핸들러
            if (red) {
                if (red.state.startsWith('entering')) {
                    red.x -= 300 * dt;
                    if (red.x <= red.targetX) {
                        red.x = red.targetX;
                        red.state = red.state.replace('entering', 'shouting');
                    }
                } else if (red.state.startsWith('shouting')) {
                    red.timer += dt;
                    if (red.state === 'shouting_p') {
                        if (red.timer > 0.8 && !isThunderboltActive && !isGameWon) {
                            isThunderboltActive = true;
                            thunderboltTimer = 0;
                            redThunderTriggered = true; 

                            slowpokes = []; magikarps = []; pidgeots = [];
                            zapdoses = []; ghosts = []; thunderStones = [];
                            if (ghostInterval) clearInterval(ghostInterval);
                            
                            red.state = 'leaves_p';
                        }
                    } else if (red.timer > 1.2) {
                        if (red.state === 'shouting' && !charizard) {
                            charizard = { x: CANVAS_WIDTH + 260, y: CANVAS_HEIGHT / 2 - 40, targetX: CANVAS_WIDTH - 150, drawWidth: 340, drawHeight: 340, state: 'entering' };
                        } else if (red.state === 'shouting_b' && !blastoise) {
                            blastoise = { x: CANVAS_WIDTH + 260, y: CANVAS_HEIGHT / 2 - 40, targetX: CANVAS_WIDTH - 150, drawWidth: 340, drawHeight: 340, state: 'entering' };
                        } else if (red.state === 'shouting_a' && !alakazam) {
                            alakazam = { x: CANVAS_WIDTH + 260, y: CANVAS_HEIGHT / 2 - 40, targetX: CANVAS_WIDTH - 150, drawWidth: 340, drawHeight: 340, state: 'entering' };
                        }
                    }
                } else if (red.state === 'leaving' || red.state === 'leaves_p') {
                    red.x += 350 * dt;
                    if (red.x > CANVAS_WIDTH + 140) red = null;
                }
            }

            // 백만볼트 연출
            if (isThunderboltActive) {
                thunderboltTimer += dt;
                lightningBolts = [];
                for (let i = 0; i < 7; i++) {
                    lightningBolts.push({
                        startX: pikachu.x + (Math.random() - 0.5) * 30,
                        startY: pikachu.y + (Math.random() - 0.5) * 30,
                        endX: Math.random() * CANVAS_WIDTH,
                        endY: Math.random() * CANVAS_HEIGHT
                    });
                }

                for (let i = 0; i < 8; i++) {
                    fireParticles.push({
                        x: Math.random() * CANVAS_WIDTH,
                        y: Math.random() * CANVAS_HEIGHT,
                        vx: (Math.random() - 0.5) * 200,
                        vy: (Math.random() - 0.5) * 200,
                        size: Math.random() * 8 + 4,
                        life: 0.5,
                        decay: 2.2,
                        colorType: Math.random() > 0.3 ? '#ffff00' : '#ffffff'
                    });
                }

                if (thunderboltTimer >= 2.0) {
                    isThunderboltActive = false;
                    lightningBolts = [];
                }
            }

            if (redThunderTriggered && !isThunderboltActive && !isGameWon) {
                thunderboltTimer += dt; 
                if (thunderboltTimer >= 2.5) {
                    isGameWon = true;
                    updateProgressBar();
                }
            }

            // 리자몽 & 불대문자
            if (charizard) {
                if (charizard.state === 'entering') {
                    charizard.x -= 380 * dt;
                    if (charizard.x <= charizard.targetX) {
                        charizard.x = charizard.targetX;
                        charizard.state = 'firing';
                        fireBlast = { x: charizard.x - 150, y: CANVAS_HEIGHT / 2, vx: -580, drawWidth: 540, drawHeight: 540 };
                    }
                } else if (charizard.state === 'firing') {
                    if (!fireBlast) {
                        charizard.state = 'leaving';
                        if (red) red.state = 'leaving';
                    }
                } else if (charizard.state === 'leaving') {
                    charizard.x += 400 * dt;
                    if (charizard.x > CANVAS_WIDTH + 360) charizard = null;
                }
            }

            if (fireBlast) {
                fireBlast.x += fireBlast.vx * dt;
                for (let i = 0; i < 8; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 120 + 40;
                    fireParticles.push({
                        x: fireBlast.x + (Math.random() - 0.5) * 250,
                        y: fireBlast.y + (Math.random() - 0.5) * 250,
                        vx: Math.cos(angle) * speed + fireBlast.vx * 0.2,
                        vy: Math.sin(angle) * speed - Math.random() * 60,
                        size: Math.random() * 16 + 8,
                        life: 1.0,
                        decay: Math.random() * 2.5 + 1.5,
                        colorType: Math.random() > 0.4 ? '#ff3300' : (Math.random() > 0.5 ? '#ff9900' : '#ffff44')
                    });
                }

                const isSwept = (obj) => Math.abs(obj.y - fireBlast.y) < 250 && obj.x > fireBlast.x - 250;
                slowpokes = slowpokes.filter(s => !isSwept(s));
                magikarps = magikarps.filter(m => !isSwept(m));
                pidgeots = pidgeots.filter(p => !isSwept(p));
                zapdoses = zapdoses.filter(z => !isSwept(z));

                if (fireBlast.x < -360) fireBlast = null;
            }

            // 거북왕 & 하이드로펌프
            if (blastoise) {
                if (blastoise.state === 'entering') {
                    blastoise.x -= 380 * dt;
                    if (blastoise.x <= blastoise.targetX) {
                        blastoise.x = blastoise.targetX;
                        blastoise.state = 'firing';
                        hydroPump = { x: blastoise.x - 150, y: CANVAS_HEIGHT / 2, vx: -700, drawWidth: CANVAS_WIDTH * 1.5, drawHeight: CANVAS_HEIGHT };
                    }
                } else if (blastoise.state === 'firing') {
                    if (!hydroPump) {
                        blastoise.state = 'leaving';
                        if (red) red.state = 'leaving';
                    }
                } else if (blastoise.state === 'leaving') {
                    blastoise.x += 400 * dt;
                    if (blastoise.x > CANVAS_WIDTH + 360) {
                        blastoise = null;
                        isBlastoiseEventFinished = true;
                        pikachu.normalSpeed = pikachu.boostedSpeed;
                        pikachu.speed = pikachu.boostedSpeed;
                    }
                }
            }

            if (hydroPump) {
                hydroPump.x += hydroPump.vx * dt;
                for (let i = 0; i < 15; i++) {
                    fireParticles.push({
                        x: hydroPump.x + Math.random() * hydroPump.drawWidth,
                        y: hydroPump.y + (Math.random() - 0.5) * hydroPump.drawHeight,
                        vx: hydroPump.vx * 0.6 + (Math.random() - 0.5) * 150,
                        vy: (Math.random() - 0.5) * 150,
                        size: Math.random() * 20 + 10,
                        life: 1.0,
                        decay: Math.random() * 3 + 1.5,
                        colorType: Math.random() > 0.6 ? '#e1f5fe' : (Math.random() > 0.3 ? '#4fc3f7' : '#0288d1')
                    });
                }

                const isSwept = (obj) => obj.x > hydroPump.x;
                slowpokes = slowpokes.filter(s => !isSwept(s));
                magikarps = magikarps.filter(m => !isSwept(m));
                pidgeots = pidgeots.filter(p => !isSwept(p));
                zapdoses = zapdoses.filter(z => !isSwept(z));

                if (hydroPump.x + hydroPump.drawWidth < -200) hydroPump = null;
            }

            // 후딘 & 사이코키네시스
            if (alakazam) {
                if (alakazam.state === 'entering') {
                    alakazam.x -= 380 * dt;
                    if (alakazam.x <= alakazam.targetX) {
                        alakazam.x = alakazam.targetX;
                        alakazam.state = 'firing';
                        isPsychicActive = true;
                    }
                } else if (alakazam.state === 'firing') {
                    if (!isPsychicActive) {
                        alakazam.state = 'leaving';
                        if (red) red.state = 'leaving';
                    }
                } else if (alakazam.state === 'leaving') {
                    alakazam.x += 400 * dt;
                    if (alakazam.x > CANVAS_WIDTH + 360) alakazam = null;
                }
            }

            if (isPsychicActive) {
                globalObstacleOpacity -= dt * 1.0;
                for (let i = 0; i < 3; i++) {
                    fireParticles.push({
                        x: Math.random() * CANVAS_WIDTH,
                        y: Math.random() * CANVAS_HEIGHT,
                        vx: (Math.random() - 0.5) * 100,
                        vy: -Math.random() * 100 - 50,
                        size: Math.random() * 10 + 5,
                        life: 1.0,
                        decay: 2.0,
                        colorType: 'rgba(186, 85, 211, 0.8)'
                    });
                }

                if (globalObstacleOpacity <= 0) {
                    globalObstacleOpacity = 1.0;
                    slowpokes = []; magikarps = []; pidgeots = []; zapdoses = [];
                    isPsychicActive = false;
                    if (!isGhostPhase) {
                        isGhostPhase = true;
                        ghostInterval = setInterval(() => { if (!isGameOver && !isGameWon) spawnGhost(); }, 500);
                    }
                }
            }

            // 파티클 업데이트
            for (let i = fireParticles.length - 1; i >= 0; i--) {
                const fp = fireParticles[i];
                fp.x += fp.vx * dt;
                fp.y += fp.vy * dt;
                fp.size += dt * 15;
                fp.life -= fp.decay * dt;
                if (fp.life <= 0) fireParticles.splice(i, 1);
            }

            // 무적 전기 스파크 파티클 생성
            if (pikachu.isInvincible || isTestInvincible) {
                for (let i = 0; i < 3; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const dist = 8 + Math.random() * 20;
                    electricSparkParticles.push({
                        x: pikachu.x + Math.cos(angle) * dist,
                        y: pikachu.y + Math.sin(angle) * dist,
                        vx: (Math.random() - 0.5) * 220,
                        vy: (Math.random() - 0.5) * 220,
                        size: Math.random() * 2.5 + 1.2,
                        life: 1.0,
                        decay: Math.random() * 8.0 + 5.0,
                        color: Math.random() > 0.5 ? '#ffff00' : (Math.random() > 0.3 ? '#00ffff' : '#ffffff')
                    });
                }
            }

            for (let i = electricSparkParticles.length - 1; i >= 0; i--) {
                const p = electricSparkParticles[i];
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.life -= p.decay * dt;
                if (p.life <= 0) electricSparkParticles.splice(i, 1);
            }

            // 무적 타이머
            if (pikachu.isInvincible && !isTestInvincible) {
                pikachu.invincibleTimer -= dt;

                if (invincibleStatusElement) {
                    if (pikachu.invincibleTimer <= 1.5) {
                        const isFlickerVisible = Math.floor(pikachu.invincibleTimer * 8) % 2 === 0;
                        invincibleStatusElement.style.opacity = isFlickerVisible ? "1" : "0.2";
                    } else {
                        invincibleStatusElement.style.opacity = "1";
                    }
                }

                if (pikachu.invincibleTimer <= 0) {
                    pikachu.isInvincible = false;
                    pikachu.speed = pikachu.normalSpeed;
                    if (invincibleStatusElement) invincibleStatusElement.style.display = "none";
                    electricSparkParticles = [];
                }
            }

            // 장애물 점진적 스폰
            if (!isGhostPhase && !isThunderboltActive && !isGameWon) {
                const targetSlowpokeCount = Math.min(25, 5 + Math.floor(survivalTime / 1.5));
                if (slowpokes.length < targetSlowpokeCount && Math.random() < 0.05) {
                    spawnSlowpoke();
                }
            }

            let dx = 0;
            let dy = 0;

            if (keys["ArrowUp"] || keys["w"] || keys["W"]) dy -= 1;
            if (keys["ArrowDown"] || keys["s"] || keys["S"]) dy += 1;
            if (keys["ArrowLeft"] || keys["a"] || keys["A"]) dx -= 1;
            if (keys["ArrowRight"] || keys["d"] || keys["D"]) dx += 1;

            if (dx !== 0 && dy !== 0) {
                dx *= Math.SQRT1_2;
                dy *= Math.SQRT1_2;
            }

            pikachu.x += dx * pikachu.speed * dt;
            pikachu.y += dy * pikachu.speed * dt;

            pikachu.x = Math.max(pikachu.size, Math.min(CANVAS_WIDTH - pikachu.size, pikachu.x));
            pikachu.y = Math.max(pikachu.size, Math.min(CANVAS_HEIGHT - pikachu.size, pikachu.y));

            // 번개의돌 충돌 체크
            for (let i = thunderStones.length - 1; i >= 0; i--) {
                const ts = thunderStones[i];
                ts.x += ts.vx * dt;
                ts.y += ts.vy * dt;

                if (ts.x < -60 || ts.x > CANVAS_WIDTH + 60 || ts.y < -60 || ts.y > CANVAS_HEIGHT + 60) {
                    thunderStones.splice(i, 1);
                    continue;
                }

                if (Math.hypot(pikachu.x - ts.x, pikachu.y - ts.y) < pikachu.size + ts.size) {
                    thunderStones.splice(i, 1);
                    pikachu.isInvincible = true;
                    pikachu.invincibleTimer = 4.0;
                    pikachu.speed = pikachu.boostedSpeed;
                    if (invincibleStatusElement) {
                        if (!isTestInvincible) {
                            invincibleStatusElement.textContent = "⚡ 라이츄 진화 (무적)! ⚡";
                        }
                        invincibleStatusElement.style.display = "inline";
                        invincibleStatusElement.style.opacity = "1";
                    }
                }
            }

            const checkCollision = (target) => {
                if (pikachu.isInvincible || isTestInvincible) return false;
                if (isPsychicActive || isThunderboltActive || isGameWon) return false;
                return Math.hypot(pikachu.x - target.x, pikachu.y - target.y) < pikachu.size + target.size;
            };

            for (let i = slowpokes.length - 1; i >= 0; i--) {
                const s = slowpokes[i];
                s.x += s.vx * dt; s.y += s.vy * dt;
                if (s.x < -60 || s.x > CANVAS_WIDTH + 60 || s.y < -60 || s.y > CANVAS_HEIGHT + 60) { slowpokes.splice(i, 1); continue; }
                if (checkCollision(s)) isGameOver = true;
            }

            for (let i = magikarps.length - 1; i >= 0; i--) {
                const m = magikarps[i];
                m.x += m.vx * dt; m.y += m.vy * dt;
                if (m.x < -60 || m.x > CANVAS_WIDTH + 60 || m.y < -60 || m.y > CANVAS_HEIGHT + 60) { magikarps.splice(i, 1); continue; }
                if (checkCollision(m)) isGameOver = true;
            }

            for (let i = pidgeots.length - 1; i >= 0; i--) {
                const p = pidgeots[i];
                p.x += p.vx * dt; p.y += p.vy * dt;
                if (p.x < -80 || p.x > CANVAS_WIDTH + 80 || p.y < -80 || p.y > CANVAS_HEIGHT + 80) { pidgeots.splice(i, 1); continue; }
                if (checkCollision(p)) isGameOver = true;
            }

            for (let i = zapdoses.length - 1; i >= 0; i--) {
                const z = zapdoses[i];
                z.x += z.vx * dt; z.y += z.vy * dt;
                if (z.x < -250 || z.x > CANVAS_WIDTH + 250 || z.y < -250 || z.y > CANVAS_HEIGHT + 250) { zapdoses.splice(i, 1); continue; }
                if (checkCollision(z)) isGameOver = true;
            }

            for (let i = ghosts.length - 1; i >= 0; i--) {
                const g = ghosts[i];
                g.x += g.vx * dt; g.y += g.vy * dt;
                if (g.x < -100 || g.x > CANVAS_WIDTH + 100 || g.y < -100 || g.y > CANVAS_HEIGHT + 100) { ghosts.splice(i, 1); continue; }
                if (checkCollision(g)) isGameOver = true;
            }
        }

        // 무적 상태일 때 피카츄/라이츄를 감싸는 찌직거리는 전기장 필드 애니메이션
        function drawElectricField(x, y) {
            if (!ctx) return;
            const time = performance.now() * 0.015;
            ctx.save();
            ctx.globalCompositeOperation = "lighter";

            // 1. 외곽 전자기장 구형 구 글로우
            const baseRadius = 26;
            const pulse = Math.sin(time * 12) * 3;
            const currentRadius = baseRadius + pulse;

            const grad = ctx.createRadialGradient(x, y, 4, x, y, currentRadius + 12);
            grad.addColorStop(0, "rgba(255, 255, 220, 0.45)");
            grad.addColorStop(0.4, "rgba(0, 242, 254, 0.35)");
            grad.addColorStop(1, "rgba(0, 242, 254, 0)");

            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(x, y, currentRadius + 12, 0, Math.PI * 2);
            ctx.fill();

            // 2. 피카츄 주위를 둘러싸며 고속으로 찌직거리는 전기 아크선들
            const numArcs = 6;
            for (let a = 0; a < numArcs; a++) {
                ctx.beginPath();
                const startAngle = (a / numArcs) * Math.PI * 2 + Math.sin(time * 4 + a * 2) * 0.4;
                const endAngle = startAngle + (Math.PI / numArcs) * (1.2 + Math.random() * 0.5);
                const arcSegments = 5;

                ctx.strokeStyle = a % 2 === 0 ? "#ffff00" : (a % 3 === 0 ? "#00ffff" : "#ffffff");
                ctx.lineWidth = 2 + Math.random() * 1.5;
                ctx.shadowColor = a % 2 === 0 ? "#ffff00" : "#00f2fe";
                ctx.shadowBlur = 12;

                for (let i = 0; i <= arcSegments; i++) {
                    const angle = startAngle + (endAngle - startAngle) * (i / arcSegments);
                    const rJitter = currentRadius + (Math.random() - 0.5) * 11;
                    const px = x + Math.cos(angle) * rJitter;
                    const py = y + Math.sin(angle) * rJitter;

                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.stroke();
            }

            // 3. 캐릭터 중심에서 밖으로 방사형으로 사방으로 튀는 번개 줄기
            const numSparks = 4;
            for (let s = 0; s < numSparks; s++) {
                const angle = Math.random() * Math.PI * 2;
                const innerR = 6 + Math.random() * 6;
                const outerR = currentRadius + 6 + Math.random() * 14;

                const x1 = x + Math.cos(angle) * innerR;
                const y1 = y + Math.sin(angle) * innerR;
                const x2 = x + Math.cos(angle) * outerR;
                const y2 = y + Math.sin(angle) * outerR;

                ctx.strokeStyle = Math.random() > 0.3 ? "#ffffff" : "#ffee00";
                ctx.lineWidth = 1.8;
                ctx.shadowColor = "#ffffff";
                ctx.shadowBlur = 10;

                ctx.beginPath();
                ctx.moveTo(x1, y1);
                const midX = (x1 + x2) / 2 + (Math.random() - 0.5) * 16;
                const midY = (y1 + y2) / 2 + (Math.random() - 0.5) * 16;
                ctx.lineTo(midX, midY);
                ctx.lineTo(x2, y2);
                ctx.stroke();
            }

            // 4. 스파크 입자 파티클들 (직선형 스파크 표현)
            electricSparkParticles.forEach(p => {
                ctx.strokeStyle = p.color;
                ctx.lineWidth = p.size;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(p.x + p.vx * 0.06, p.y + p.vy * 0.06);
                ctx.stroke();
            });

            ctx.restore();
        }

        function drawBlazingFireBlast(x, y, width, height) {
            if (!ctx) return;
            const time = performance.now() * 0.012;
            ctx.save();
            ctx.translate(x, y);

            const scalePulse = 1 + Math.sin(time * 3) * 0.05;
            ctx.scale(scalePulse, scalePulse);

            ctx.shadowBlur = 35 + Math.sin(time * 6) * 15;
            ctx.shadowColor = "#ff2200";

            const drawDaiPath = (offset, jitterAmt) => {
                ctx.beginPath();
                const j1 = Math.sin(time * 5 + offset) * jitterAmt;
                const j2 = Math.cos(time * 6 + offset) * jitterAmt;
                const j3 = Math.sin(time * 7 + offset) * jitterAmt;

                ctx.moveTo(-width * 0.42 + j1, -height * 0.05 + j2);
                ctx.quadraticCurveTo(0, -height * 0.08 + j3, width * 0.42 + j2, -height * 0.05 + j1);
                ctx.moveTo(0 + j3, -height * 0.42 + j1);
                ctx.quadraticCurveTo(-width * 0.05 + j2, 0, -width * 0.38 + j1, height * 0.42 + j3);
                ctx.moveTo(0 + j1, 0 + j2);
                ctx.quadraticCurveTo(width * 0.2 + j3, height * 0.2, width * 0.38 + j2, height * 0.42 + j1);
            };

            ctx.lineWidth = 48 + Math.sin(time * 4) * 6;
            ctx.lineCap = "round";
            ctx.lineJoin = "round";
            ctx.strokeStyle = "#d61800";
            drawDaiPath(0, 7);
            ctx.stroke();

            ctx.lineWidth = 34 + Math.cos(time * 5) * 4;
            ctx.strokeStyle = "#ff6a00";
            drawDaiPath(1.5, 4);
            ctx.stroke();

            ctx.lineWidth = 20 + Math.sin(time * 8) * 3;
            ctx.strokeStyle = "#ffea00";
            drawDaiPath(3.0, 2);
            ctx.stroke();

            ctx.lineWidth = 8;
            ctx.strokeStyle = "#ffffff";
            drawDaiPath(4.5, 1);
            ctx.stroke();

            ctx.restore();
        }

        function drawHydroPump(x, y, width, height) {
            if (!ctx) return;
            const time = performance.now() * 0.015;
            ctx.save();
            ctx.translate(x, y);

            const waveHeight = height * 0.8 + Math.sin(time) * (height * 0.2);
            const gradient = ctx.createLinearGradient(0, -waveHeight/2, 0, waveHeight/2);
            gradient.addColorStop(0, "rgba(225, 245, 254, 0.0)");
            gradient.addColorStop(0.15, "rgba(79, 195, 247, 0.9)");
            gradient.addColorStop(0.5, "rgba(255, 255, 255, 1.0)");
            gradient.addColorStop(0.85, "rgba(2, 136, 209, 0.9)");
            gradient.addColorStop(1, "rgba(1, 87, 155, 0.0)");

            ctx.fillStyle = gradient;
            ctx.fillRect(0, -waveHeight / 2, width, waveHeight);
            ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
            ctx.fillRect(0, -waveHeight * 0.15, width, waveHeight * 0.3);
            ctx.restore();
        }

        function drawLightningBolt(x1, y1, x2, y2) {
            if (!ctx) return;
            ctx.save();
            ctx.strokeStyle = "#ffff55";
            ctx.lineWidth = 3;
            ctx.shadowColor = "#ffee00";
            ctx.shadowBlur = 15;

            ctx.beginPath();
            ctx.moveTo(x1, y1);

            const segments = 6;
            for (let i = 1; i < segments; i++) {
                const targetX = x1 + (x2 - x1) * (i / segments);
                const targetY = y1 + (y2 - y1) * (i / segments);
                ctx.lineTo(targetX + (Math.random() - 0.5) * 50, targetY + (Math.random() - 0.5) * 50);
            }
            ctx.lineTo(x2, y2);
            ctx.stroke();

            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 1.5;
            ctx.stroke();
            ctx.restore();
        }

        function drawSpeechBubble(x, y, text) {
            if (!ctx) return;
            ctx.save();
            ctx.font = "bold 15px Arial, sans-serif";
            const textWidth = ctx.measureText(text).width;
            const bubbleWidth = textWidth + 24;
            const bubbleHeight = 36;
            const bx = x - bubbleWidth / 2;
            const by = y - 70;

            ctx.fillStyle = "#ffffff";
            ctx.strokeStyle = "#000000";
            ctx.lineWidth = 2.5;

            ctx.beginPath();
            ctx.roundRect(bx, by, bubbleWidth, bubbleHeight, 8);
            ctx.fill();
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(x - 6, by + bubbleHeight);
            ctx.lineTo(x + 6, by + bubbleHeight);
            ctx.lineTo(x, by + bubbleHeight + 9);
            ctx.closePath();
            ctx.fillStyle = "#ffffff";
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = "#000000";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(text, x, by + bubbleHeight / 2);
            ctx.restore();
        }

        function draw() {
            if (!ctx) return;
            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            ctx.imageSmoothingEnabled = false;

            if (isThunderboltActive && Math.random() > 0.35) {
                ctx.fillStyle = "rgba(255, 255, 180, 0.18)";
                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            }

            // 무적 상태 시 찌직거리는 전기장 필드 그리기
            if (pikachu.isInvincible || isTestInvincible) {
                const shouldDrawField = isTestInvincible || pikachu.invincibleTimer > 1.5 || (Math.floor(pikachu.invincibleTimer * 12) % 2 === 0);
                if (shouldDrawField) {
                    drawElectricField(pikachu.x, pikachu.y);
                }
            }

            const isCurrentRaichu = pikachu.isInvincible || isTestInvincible;
            const activePlayerImg = isCurrentRaichu ? (raichuLoaded ? raichuImg : pikachuImg) : (pikachuLoaded ? pikachuImg : null);
            if (activePlayerImg) {
                const w = isCurrentRaichu ? 50 : pikachu.drawWidth;
                const h = isCurrentRaichu ? 50 : pikachu.drawHeight;
                ctx.drawImage(activePlayerImg, pikachu.x - w / 2, pikachu.y - h / 2, w, h);
            } else {
                ctx.fillStyle = "#ffffff";
                ctx.font = "28px sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(isCurrentRaichu ? "⚡🐭" : "⚡", pikachu.x, pikachu.y);
            }

            ctx.save();
            ctx.globalAlpha = globalObstacleOpacity;

            thunderStones.forEach(ts => {
                if (thunderStoneLoaded) {
                    ctx.drawImage(thunderStoneImg, ts.x - ts.drawWidth / 2, ts.y - ts.drawHeight / 2, ts.drawWidth, ts.drawHeight);
                } else {
                    ctx.fillStyle = "#ffffff"; ctx.font = "22px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
                    ctx.fillText("💎", ts.x, ts.y);
                }
            });

            slowpokes.forEach(s => {
                let img = null;
                if (s.type === 'slowbro') img = slowbroLoaded ? slowbroImg : null;
                else if (s.type === 'slowking') img = slowkingLoaded ? slowkingImg : null;
                else img = slowpokeLoaded ? slowpokeImg : null;

                if (img) {
                    ctx.drawImage(img, s.x - s.drawWidth / 2, s.y - s.drawHeight / 2, s.drawWidth, s.drawHeight);
                } else {
                    ctx.fillStyle = "#ffffff"; ctx.font = "22px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
                    let emoji = "🦛";
                    if (s.type === 'slowbro') emoji = "🦛🐚";
                    else if (s.type === 'slowking') emoji = "👑";
                    ctx.fillText(emoji, s.x, s.y);
                }
            });

            magikarps.forEach(m => {
                const img = m.type === 'mew' ? (mewLoaded ? mewImg : null) : (magikarpLoaded ? magikarpImg : null);
                if (img) {
                    ctx.drawImage(img, m.x - m.drawWidth / 2, m.y - m.drawHeight / 2, m.drawWidth, m.drawHeight);
                } else {
                    ctx.fillStyle = "#ffffff"; ctx.font = "22px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
                    ctx.fillText(m.type === 'mew' ? "✨" : "🐟", m.x, m.y);
                }
            });

            pidgeots.forEach(p => {
                let img = null, emoji = "🦅";
                if (p.type === 'caterpie') { img = caterpieLoaded ? caterpieImg : null; emoji = "🐛"; }
                else if (p.type === 'red_gyarados') { img = redGyaradosLoaded ? redGyaradosImg : null; emoji = "🔴🐉"; }
                else if (p.type === 'gyarados') { img = gyaradosLoaded ? gyaradosImg : null; emoji = "🐉"; }
                else { img = pidgeotLoaded ? pidgeotImg : null; }

                if (img) {
                    ctx.drawImage(img, p.x - p.drawWidth / 2, p.y - p.drawHeight / 2, p.drawWidth, p.drawHeight);
                } else {
                    ctx.fillStyle = "#ffffff"; ctx.font = "28px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
                    ctx.fillText(emoji, p.x, p.y);
                }
            });

            zapdoses.forEach(z => {
                let img = null, emoji = "⚡🦅";
                if (z.type === 'mewtwo') { img = mewtwoLoaded ? mewtwoImg : null; emoji = "🧬🐱"; }
                else if (z.type === 'oak') { img = oakLoaded ? oakImg : null; emoji = "👴🏻🔬"; }
                else if (z.type === 'weedle') { img = weedleLoaded ? weedleImg : null; emoji = "🐛⚡"; }
                else if (z.type === 'articuno') { img = articunoLoaded ? articunoImg : null; emoji = "❄️🦅"; }
                else if (z.type === 'hooh') { img = hoohLoaded ? hoohImg : null; emoji = "🌈🦅"; }
                else { img = zapdosLoaded ? zapdosImg : null; }

                if (img) {
                    ctx.drawImage(img, z.x - z.drawWidth / 2, z.y - z.drawHeight / 2, z.drawWidth, z.drawHeight);
                } else {
                    ctx.fillStyle = "#ffffff";
                    let fontSize = "32px";
                    if (z.type === 'oak') fontSize = "96px";
                    else if (z.type === 'mewtwo') fontSize = "64px";
                    ctx.font = fontSize + " sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
                    ctx.fillText(emoji, z.x, z.y);
                }
            });
            
            ctx.restore();

            ghosts.forEach(g => {
                let img = null, emoji = "👻";
                if (g.type === 'gastly') img = gastlyLoaded ? gastlyImg : null;
                else if (g.type === 'haunter') img = haunterLoaded ? haunterImg : null;
                else if (g.type === 'gengar') img = gengarLoaded ? gengarImg : null;

                if (img) {
                    ctx.drawImage(img, g.x - g.drawWidth / 2, g.y - g.drawHeight / 2, g.drawWidth, g.drawHeight);
                } else {
                    ctx.fillStyle = "#ffffff"; ctx.font = "32px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
                    ctx.fillText(emoji, g.x, g.y);
                }
            });

            ctx.save();
            ctx.globalCompositeOperation = "lighter";
            fireParticles.forEach(fp => {
                ctx.fillStyle = fp.colorType;
                ctx.globalAlpha = Math.max(0, fp.life);
                ctx.beginPath();
                ctx.arc(fp.x, fp.y, fp.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.restore();

            if (isThunderboltActive) {
                lightningBolts.forEach(bolt => {
                    drawLightningBolt(bolt.startX, bolt.startY, bolt.endX, bolt.endY);
                });
            }

            if (fireBlast) drawBlazingFireBlast(fireBlast.x, fireBlast.y, fireBlast.drawWidth, fireBlast.drawHeight);
            if (hydroPump) drawHydroPump(hydroPump.x, hydroPump.y, hydroPump.drawWidth, hydroPump.drawHeight);

            if (blastoise) {
                if (blastoiseLoaded) ctx.drawImage(blastoiseImg, blastoise.x - blastoise.drawWidth / 2, blastoise.y - blastoise.drawHeight / 2, blastoise.drawWidth, blastoise.drawHeight);
                else { ctx.fillStyle = "#ffffff"; ctx.font = "120px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("🐢💧", blastoise.x, blastoise.y); }
            }

            if (alakazam) {
                if (alakazamLoaded) ctx.drawImage(alakazamImg, alakazam.x - alakazam.drawWidth / 2, alakazam.y - alakazam.drawHeight / 2, alakazam.drawWidth, alakazam.drawHeight);
                else { ctx.fillStyle = "#ffffff"; ctx.font = "120px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("🥄🥄", alakazam.x, alakazam.y); }
            }

            if (charizard) {
                if (charizardLoaded) ctx.drawImage(charizardImg, charizard.x - charizard.drawWidth / 2, charizard.y - charizard.drawHeight / 2, charizard.drawWidth, charizard.drawHeight);
                else { ctx.fillStyle = "#ffffff"; ctx.font = "120px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("🐲🔥", charizard.x, charizard.y); }
            }

            if (red) {
                if (redLoaded) ctx.drawImage(redImg, red.x - red.drawWidth / 2, red.y - red.drawHeight / 2, red.drawWidth, red.drawHeight);
                else { ctx.fillStyle = "#ffffff"; ctx.font = "60px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("👦🏻🧢", red.x, red.y); }
                
                if (!red.state.startsWith('entering')) {
                    drawSpeechBubble(red.x, red.y - red.drawHeight / 2, red.text);
                }
            }

            if (isGameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.8)";
                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

                ctx.fillStyle = "#FF4D4D";
                ctx.font = "bold 36px sans-serif";
                ctx.textAlign = "center"; ctx.textBaseline = "middle";
                ctx.fillText("GAME OVER", CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 - 20);

                ctx.fillStyle = "#FFF";
                ctx.font = "18px sans-serif";
                ctx.fillText(`기록: ${survivalTime}초`, CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 + 20);
                ctx.fillText("'R' 키를 눌러 다시 시작하세요", CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 + 50);
            }

            if (isGameWon) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

                ctx.fillStyle = "#FFDD00";
                ctx.shadowColor = "#FFAA00";
                ctx.shadowBlur = 20;
                ctx.font = "bold 40px sans-serif";
                ctx.textAlign = "center"; ctx.textBaseline = "middle";
                ctx.fillText("⚡ 생존완료 ⚡", CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 - 40);

                ctx.shadowBlur = 0;
                ctx.fillStyle = "#FFFFFF";
                ctx.font = "bold 20px sans-serif";
                ctx.fillText("모든 시련을 극복하고 완벽하게 생존했습니다!", CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 + 10);

                ctx.fillStyle = "#A8FFB2";
                ctx.font = "17px sans-serif";
                ctx.fillText(`최종 기록: ${survivalTime}초 (클리어)`, CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 + 45);

                ctx.fillStyle = "#DDDDDD";
                ctx.font = "15px sans-serif";
                ctx.fillText("'R' 키를 눌러 처음부터 다시 도전하세요", CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 + 80);
            }
        }

        function gameLoop(time) {
            update(time);
            draw();
            if (!isGameOver && !isGameWon) {
                requestAnimationFrame(gameLoop);
            }
        }

        updateProgressBar();
        startSpecialTimers();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
